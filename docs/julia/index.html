<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alles Gute Julia! 🎂</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">

  <!-- Google Fonts: Elegant Serif & Modern Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Inline CSS: Guarantees 100% reliable styling on GitHub Pages regardless of trailing slash /hub/julia vs /hub/julia/ -->
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       JULIA'S BIRTHDAY SITE — MOBILE FIRST / CLEAN & MODERN
       ═══════════════════════════════════════════════════════════════════ */

    :root {
      --bg-pink: #fff5f7;
      --bg-soft-gradient: radial-gradient(circle at 50% 20%, #ffe4e6 0%, #fff1f2 50%, #fdf2f8 100%);
      --primary: #f43f5e;
      --primary-hover: #e11d48;
      --primary-glow: rgba(244, 63, 94, 0.35);

      --text-main: #27141f;
      --text-muted: #83526a;

      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: rgba(255, 255, 255, 0.95);
      --card-shadow: 0 16px 36px -8px rgba(225, 29, 72, 0.15), 0 4px 12px rgba(0, 0, 0, 0.03);

      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ── Reset & Mobile Base ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-main);
      background: var(--bg-soft-gradient);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 1rem) env(safe-area-inset-right, 1rem) env(safe-area-inset-bottom, 1rem) env(safe-area-inset-left, 1rem);
      min-height: 100dvh;
    }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    /* Mobile viewport container */
    .mobile-viewport {
      width: 100%;
      max-width: 390px;
      min-height: calc(100dvh - 2rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    /* Screen visibility controller */
    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: screenFadeIn 0.35s ease-out forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes screenFadeIn {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ── Unified Mobile Card ── */
    .card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 2.2rem 1.5rem;
      text-align: center;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ═══════════════════════════════════════════════════════════════════
       SCREEN 1: LOCK SCREEN (Minimal: Nur Datum & Bestätigen)
       ═══════════════════════════════════════════════════════════════════ */
    .lock-title {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 1.5rem;
      letter-spacing: -0.3px;
    }

    .date-picker-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 1.5rem;
    }

    .date-box {
      width: 68px;
      height: 64px;
      background: #ffffff;
      border: 2px solid rgba(244, 63, 94, 0.25);
      border-radius: 16px;
      font-family: var(--font-sans);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .date-box.year {
      width: 90px;
    }

    .date-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15);
      transform: translateY(-2px);
    }

    .dot {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fda4af;
      margin-top: 0.8rem;
    }

    .btn-primary {
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      font-family: var(--font-sans);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(244, 63, 94, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s var(--ease-spring), box-shadow 0.15s;
    }

    .btn-primary:active {
      transform: scale(0.96);
      box-shadow: 0 4px 10px rgba(244, 63, 94, 0.2);
    }

    .error-msg {
      min-height: 1.2rem;
      font-size: 0.85rem;
      color: #e11d48;
      font-weight: 600;
      margin-top: 1rem;
    }

    .shake {
      animation: shakeCard 0.4s ease-in-out;
    }

    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* ═══════════════════════════════════════════════════════════════════
       SCREEN 2: CAKE ANIMATION & GREETING
       ═══════════════════════════════════════════════════════════════════ */
    .cake-box {
      cursor: pointer;
      margin: 0.5rem 0 0.8rem;
      transition: transform 0.2s var(--ease-spring);
    }

    .cake-box:active {
      transform: scale(0.96);
    }

    /* Candle Flames */
    .flame {
      transform-origin: center bottom;
      animation: candleFlicker 1.1s ease-in-out infinite alternate;
    }

    .flame-2 {
      animation-duration: 0.9s;
      animation-delay: 0.15s;
    }

    .flame-3 {
      animation-duration: 1.3s;
      animation-delay: 0.3s;
    }

    @keyframes candleFlicker {
      0% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 5px #f59e0b); }
      50% { transform: scale(1.1, 0.92) rotate(3deg); filter: drop-shadow(0 0 10px #f43f5e); }
      100% { transform: scale(0.94, 1.06) rotate(-1deg); filter: drop-shadow(0 0 6px #f59e0b); }
    }

    .smoke {
      opacity: 0;
      transform-origin: center bottom;
    }

    .candles-extinguished .flame {
      display: none;
    }

    .candles-extinguished .smoke {
      animation: smokeCurl 2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes smokeCurl {
      0% { opacity: 0.7; transform: translateY(0) scale(0.5); }
      50% { opacity: 0.3; transform: translateY(-20px) scale(1.2) rotate(10deg); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.8) rotate(-15deg); }
    }

    .tap-tip {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 1.2rem;
    }

    .congrats-title {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1.25;
      color: var(--text-main);
      margin-bottom: 1.8rem;
      text-align: center;
    }

    .btn-call-cta {
      height: 52px;
    }

    /* ═══════════════════════════════════════════════════════════════════
       SCREEN 3: EINGEHENDER ANRUF (iPhone Style)
       ═══════════════════════════════════════════════════════════════════ */
    .iphone-call-screen {
      width: 100%;
      background: rgba(20, 10, 16, 0.94);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 36px;
      padding: 3rem 1.5rem 2.8rem;
      text-align: center;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 35px rgba(244, 63, 94, 0.2);
    }

    .call-type {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 0.5rem;
    }

    .caller-name {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .call-status {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 3rem;
    }

    .caller-center {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-wave {
      position: absolute;
      inset: -12px;
      border: 2px solid rgba(244, 63, 94, 0.5);
      border-radius: 50%;
      animation: radar 2s cubic-bezier(0.2, 0.8, 0.3, 1) infinite;
    }

    .radar-wave.delay {
      animation-delay: 0.9s;
    }

    @keyframes radar {
      0% { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .avatar-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.4);
      position: relative;
      z-index: 2;
    }

    .call-actions {
      display: flex;
      justify-content: space-around;
      width: 100%;
      padding: 0 1rem;
    }

    .action-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
    }

    .round-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: transform 0.15s var(--ease-spring);
    }

    .round-btn:active {
      transform: scale(0.9);
    }

    .btn-decline {
      background: #ef4444;
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.4);
    }

    .btn-accept {
      background: #22c55e;
      box-shadow: 0 6px 22px rgba(34, 197, 94, 0.5);
      animation: acceptPulse 1.4s ease-in-out infinite;
    }

    @keyframes acceptPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* ═══════════════════════════════════════════════════════════════════
       SCREEN 4: YOUTUBE SHORT VIDEO (Mobil-optimiert 9:16)
       ═══════════════════════════════════════════════════════════════════ */
    .video-card {
      width: 100%;
      background: #111111;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    .video-header {
      padding: 1rem 1.2rem;
      background: #1a1a1a;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .timer {
      background: rgba(255, 255, 255, 0.15);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    .short-frame {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 68vh;
      background: #000;
    }

    .short-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-footer {
      padding: 0.9rem 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: #1a1a1a;
    }

    .btn-yt-direct {
      color: #fda4af;
      font-size: 0.85rem;
      text-decoration: underline;
      text-align: center;
      font-weight: 600;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 0.7rem;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ═══════════════════════════════════════════════════════════════════
       SCREEN EXPIRED (Ab 1.11.)
       ═══════════════════════════════════════════════════════════════════ */
    .card-expired {
      padding: 3rem 1.5rem;
    }

    .emoji-header {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .card-expired h2 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      margin-bottom: 0.6rem;
    }

    .card-expired p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .badge-mini {
      display: inline-block;
      background: rgba(244, 63, 94, 0.1);
      color: var(--primary);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: rgba(20, 10, 16, 0.92);
      color: #fff;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s var(--ease-spring);
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Background Canvas for Confetti -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="mobile-viewport">

    <!-- ═══════════════════════════════════════════════════════════════
         EXPIRED SCREEN (Aktiv ab dem 1.11.)
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-expired" class="screen" aria-label="Abgelaufen" style="display: none;">
      <div class="card card-expired">
        <div class="emoji-header">🔒</div>
        <h2>Nicht mehr verfügbar</h2>
        <p>Diese Website war nur an Julias Geburtstag (31.10.) aktiv.</p>
        <div class="badge-mini">31.10.2006 🎂</div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         SCREEN 1: GEBURTSTAGSEINGABE (Minimal & Ohne Corny Text)
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-lock" class="screen active" aria-label="Geburtsdatum eingeben">
      <div class="card card-lock">
        <h1 class="lock-title">Geburtsdatum</h1>

        <form id="lock-form" onsubmit="event.preventDefault();" novalidate>
          <div class="date-picker-row">
            <input 
              id="in-day" 
              class="date-box" 
              type="tel" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              maxlength="2" 
              placeholder="TT" 
              autocomplete="off" 
              autofocus 
              aria-label="Tag"
            >
            <span class="dot">.</span>
            <input 
              id="in-month" 
              class="date-box" 
              type="tel" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              maxlength="2" 
              placeholder="MM" 
              autocomplete="off" 
              aria-label="Monat"
            >
            <span class="dot">.</span>
            <input 
              id="in-year" 
              class="date-box year" 
              type="tel" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              maxlength="4" 
              placeholder="JJJJ" 
              autocomplete="off" 
              aria-label="Jahr"
            >
          </div>

          <button id="btn-confirm-date" class="btn-primary" type="button">
            Bestätigen
          </button>

          <div id="lock-error" class="error-msg" aria-live="polite"></div>
        </form>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         SCREEN 2: KUCHEN ANIMATION & ALLES GUTE ZUM GEBURTSTAG JULIA
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-cake" class="screen" aria-label="Geburtstagskuchen">
      <div class="card card-cake">
        
        <!-- Interactive Cake SVG -->
        <div id="cake-interactive" class="cake-box" role="button" tabindex="0" title="Tippe auf den Kuchen!">
          <svg width="220" height="200" viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Plate -->
            <ellipse cx="110" cy="180" rx="100" ry="14" fill="#FCE7F3" stroke="#F472B6" stroke-width="2"/>
            <ellipse cx="110" cy="177" rx="90" ry="10" fill="#FFFFFF"/>

            <!-- Cake Tier 1 -->
            <path d="M35 130 C35 115 185 115 185 130 V170 C185 180 35 180 35 170 Z" fill="#FBCFE8"/>
            <ellipse cx="110" cy="130" rx="75" ry="15" fill="#FDF2F8"/>
            <path d="M35 130 C45 140 55 140 65 130 C75 140 85 140 95 130 C105 140 115 140 125 130 C135 140 145 140 155 130 C165 140 175 140 185 130 V136 C175 146 165 146 155 136 C145 146 135 146 125 136 C115 146 105 146 95 136 C85 146 75 146 65 136 C55 146 45 146 35 136 Z" fill="#F43F5E"/>

            <!-- Cake Tier 2 -->
            <path d="M55 88 C55 75 165 75 165 88 V122 C165 130 55 130 55 122 Z" fill="#FFF1F2"/>
            <ellipse cx="110" cy="88" rx="55" ry="12" fill="#FFFFFF"/>

            <!-- Berry toppings -->
            <circle cx="70" cy="86" r="6" fill="#E11D48"/>
            <circle cx="90" cy="83" r="6" fill="#E11D48"/>
            <circle cx="110" cy="82" r="6" fill="#E11D48"/>
            <circle cx="130" cy="83" r="6" fill="#E11D48"/>
            <circle cx="150" cy="86" r="6" fill="#E11D48"/>

            <!-- Candle 1 -->
            <rect x="80" y="48" width="6" height="36" rx="3" fill="#FB7185"/>
            <line x1="83" y1="48" x2="83" y2="40" stroke="#475569" stroke-width="2"/>
            <g class="flame flame-1">
              <path d="M83 40 C79 34 80 28 83 22 C86 28 87 34 83 40 Z" fill="#F59E0B"/>
              <circle cx="83" cy="35" r="2" fill="#FEF08A"/>
            </g>
            <path class="smoke" d="M83 40 Q80 30 86 18 T82 6" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>

            <!-- Candle 2 (Center) -->
            <rect x="107" y="42" width="6" height="42" rx="3" fill="#F59E0B"/>
            <line x1="110" y1="42" x2="110" y2="34" stroke="#475569" stroke-width="2"/>
            <g class="flame flame-2">
              <path d="M110 34 C106 28 107 20 110 14 C113 20 114 28 110 34 Z" fill="#F59E0B"/>
              <circle cx="110" cy="28" r="2.5" fill="#FEF08A"/>
            </g>
            <path class="smoke" d="M110 34 Q107 24 113 12 T109 2" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>

            <!-- Candle 3 -->
            <rect x="134" y="48" width="6" height="36" rx="3" fill="#FB7185"/>
            <line x1="137" y1="48" x2="137" y2="40" stroke="#475569" stroke-width="2"/>
            <g class="flame flame-3">
              <path d="M137 40 C133 34 134 28 137 22 C140 28 141 34 137 40 Z" fill="#F59E0B"/>
              <circle cx="137" cy="35" r="2" fill="#FEF08A"/>
            </g>
            <path class="smoke" d="M137 40 Q134 30 140 18 T136 6" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="tap-tip">Tippe auf die Kerzen 🕯️</div>

        <h1 class="congrats-title">
          Alles Gute zum Geburtstag Julia! 🎂
        </h1>

        <button id="btn-next-call" class="btn-primary btn-call-cta" type="button">
          Weiter 📞
        </button>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         SCREEN 3: EINGEHENDER ANRUF (iPhone Style, Klingelt)
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-call" class="screen" aria-label="Eingehender Anruf">
      <div class="iphone-call-screen">
        <div class="call-top">
          <div class="call-type">FaceTime-Videoanruf</div>
          <div class="caller-name">Marvin</div>
          <div class="call-status">Klingelt...</div>
        </div>

        <div class="caller-center">
          <div class="radar-wave"></div>
          <div class="radar-wave delay"></div>
          <div class="avatar-circle">M</div>
        </div>

        <div class="call-actions">
          <div class="action-btn-wrap">
            <button id="btn-decline" class="round-btn btn-decline" type="button" aria-label="Ablehnen">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.8 19.8 0 0 1-3.12-8.69 2 2 0 0 1 2-2.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.29 8.29"/>
                <line x1="22" y1="2" x2="2" y2="22"/>
              </svg>
            </button>
            <span>Ablehnen</span>
          </div>

          <div class="action-btn-wrap">
            <button id="btn-accept" class="round-btn btn-accept" type="button" aria-label="Annehmen">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
            </button>
            <span>Annehmen</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         SCREEN 4: YOUTUBE SHORT VIDEO (Mobil-optimiertes Theater)
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-video" class="screen" aria-label="Videoüberraschung">
      <div class="video-card">
        <div class="video-header">
          <span>FaceTime mit Marvin</span>
          <span id="call-counter" class="timer">00:01</span>
        </div>

        <div class="short-frame">
          <iframe 
            id="yt-frame"
            src="" 
            title="Geburtstagsvideo"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>

        <div class="video-footer">
          <a class="btn-yt-direct" href="https://youtube.com/shorts/XIZSZXd-RYc" target="_blank" rel="noopener noreferrer">
            Direkt auf YouTube öffnen ↗
          </a>
          <button id="btn-replay-cake" class="btn-ghost" type="button">
            Zurück zur Torte 🎂
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Mobile Toast Notification -->
  <aside id="toast-note" class="toast" role="status" aria-live="polite"></aside>

  <!-- Inline JS: Fully self-contained, no relative path or CDN latency issues -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // ── CHECK: AB DEM 1.11. NICHT MEHR AUFRUFBAR ──
      const now = new Date();
      // getMonth(): 0 = Jan ... 9 = Okt, 10 = Nov, 11 = Dez
      const isExpired = now.getMonth() >= 10 || now.getFullYear() > 2026;

      if (isExpired) {
        document.querySelectorAll('.screen').forEach(s => {
          s.classList.remove('active');
          s.style.display = 'none';
        });
        const expScreen = document.getElementById('screen-expired');
        if (expScreen) {
          expScreen.style.display = 'flex';
          expScreen.classList.add('active');
        }
        return;
      }

      // ── Web Audio Synthesizer ──
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function resumeAudio() {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSuccessChime() {
        resumeAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);

          gain.gain.setValueAtTime(0, audioCtx.currentTime + idx * 0.07);
          gain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + idx * 0.07 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.07 + 0.5);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + idx * 0.07);
          osc.stop(audioCtx.currentTime + idx * 0.07 + 0.55);
        });
      }

      // Phone Ringtone
      let ringInterval = null;
      function startPhoneRing() {
        resumeAudio();
        stopPhoneRing();

        function ring() {
          const seq = [
            { f: 1046.5, t: 0.0 },
            { f: 880.0,  t: 0.12 },
            { f: 1046.5, t: 0.24 },
            { f: 1318.5, t: 0.36 },
            { f: 1046.5, t: 0.52 },
            { f: 880.0,  t: 0.64 }
          ];

          seq.forEach(n => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(n.f, audioCtx.currentTime + n.t);

            gain.gain.setValueAtTime(0, audioCtx.currentTime + n.t);
            gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + n.t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + n.t + 0.18);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(audioCtx.currentTime + n.t);
            osc.stop(audioCtx.currentTime + n.t + 0.2);
          });
        }

        ring();
        ringInterval = setInterval(ring, 1800);
      }

      function stopPhoneRing() {
        if (ringInterval) {
          clearInterval(ringInterval);
          ringInterval = null;
        }
      }

      function playConnectSound() {
        resumeAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.35);
      }

      // ── Confetti Particle Cannon ──
      const confettiCanvas = document.getElementById('confetti-canvas');
      let confettiParticles = [];
      let confettiId = null;

      function fireConfetti(count = 90) {
        if (!confettiCanvas) return;
        const ctx = confettiCanvas.getContext('2d');
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;

        const colors = ['#f43f5e', '#fb7185', '#f59e0b', '#c084fc', '#38bdf8', '#ffffff', '#ffd1dc'];

        for (let i = 0; i < count; i++) {
          confettiParticles.push({
            x: window.innerWidth / 2 + (Math.random() - 0.5) * 160,
            y: window.innerHeight * 0.55,
            vx: (Math.random() - 0.5) * 12,
            vy: -(Math.random() * 12 + 6),
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 10,
            gravity: 0.35,
            opacity: 1
          });
        }

        if (!confettiId) {
          function anim() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

            for (let i = confettiParticles.length - 1; i >= 0; i--) {
              const p = confettiParticles[i];
              p.x += p.vx;
              p.y += p.vy;
              p.vy += p.gravity;
              p.rotation += p.rotSpeed;
              p.opacity -= 0.008;

              if (p.opacity <= 0 || p.y > confettiCanvas.height + 40) {
                confettiParticles.splice(i, 1);
                continue;
              }

              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate((p.rotation * Math.PI) / 180);
              ctx.globalAlpha = p.opacity;
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
              ctx.restore();
            }

            if (confettiParticles.length > 0) {
              confettiId = requestAnimationFrame(anim);
            } else {
              confettiId = null;
              ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
          }
          anim();
        }
      }

      // ── Toast Note ──
      const toast = document.getElementById('toast-note');
      let toastTimer = null;
      function showToast(msg) {
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2400);
      }

      // ── Stage Switching ──
      function setScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(screenId);
        if (target) target.classList.add('active');
      }

      // ── SCREEN 1: GEBURTSTAGSEINGABE (31.10.2006) ──
      const inDay = document.getElementById('in-day');
      const inMonth = document.getElementById('in-month');
      const inYear = document.getElementById('in-year');
      const btnConfirm = document.getElementById('btn-confirm-date');
      const lockError = document.getElementById('lock-error');
      const cardLock = document.querySelector('.card-lock');

      if (inDay && inMonth && inYear) {
        inDay.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/\D/g, '').slice(0, 2);
          if (e.target.value.length === 2) inMonth.focus();
        });

        inMonth.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/\D/g, '').slice(0, 2);
          if (e.target.value.length === 2) inYear.focus();
        });

        inMonth.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !inMonth.value) inDay.focus();
        });

        inYear.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
        });

        inYear.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !inYear.value) inMonth.focus();
        });

        [inDay, inMonth, inYear].forEach(inp => {
          inp.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') checkBirthday();
          });
        });
      }

      function checkBirthday() {
        const d = inDay.value.trim().padStart(2, '0');
        const m = inMonth.value.trim().padStart(2, '0');
        const y = inYear.value.trim();

        if (d === '31' && m === '10' && y === '2006') {
          lockError.textContent = '';
          playSuccessChime();
          fireConfetti(100);

          setTimeout(() => {
            setScreen('screen-cake');
            fireConfetti(80);
          }, 400);
        } else {
          cardLock.classList.remove('shake');
          void cardLock.offsetWidth;
          cardLock.classList.add('shake');
          lockError.textContent = 'Falsches Datum';
        }
      }

      btnConfirm?.addEventListener('click', checkBirthday);

      // ── SCREEN 2: KUCHEN & ALLES GUTE ──
      const cakeInteractive = document.getElementById('cake-interactive');
      const btnNextCall = document.getElementById('btn-next-call');
      let candlesOut = false;

      function toggleCandles() {
        if (candlesOut) {
          cakeInteractive.classList.remove('candles-extinguished');
          candlesOut = false;
          return;
        }
        candlesOut = true;
        cakeInteractive.classList.add('candles-extinguished');
        playSuccessChime();
        fireConfetti(120);
      }

      cakeInteractive?.addEventListener('click', toggleCandles);

      btnNextCall?.addEventListener('click', () => {
        setScreen('screen-call');
        startPhoneRing();
      });

      // ── SCREEN 3: EINGEHENDER ANRUF ──
      const btnDecline = document.getElementById('btn-decline');
      const btnAccept = document.getElementById('btn-accept');
      const callScreen = document.querySelector('.iphone-call-screen');

      btnDecline?.addEventListener('click', () => {
        callScreen.classList.remove('shake');
        void callScreen.offsetWidth;
        callScreen.classList.add('shake');
        showToast('Geh ran jetzt 😂');
      });

      btnAccept?.addEventListener('click', () => {
        stopPhoneRing();
        playConnectSound();

        setTimeout(() => {
          setScreen('screen-video');
          startTimer();
          // Load & start YouTube video ONLY after call was accepted
          const frame = document.getElementById('yt-frame');
          if (frame) {
            frame.src = "https://www.youtube-nocookie.com/embed/XIZSZXd-RYc?autoplay=1&playsinline=1&rel=0&loop=1&playlist=XIZSZXd-RYc";
          }
        }, 350);
      });

      // ── SCREEN 4: YOUTUBE SHORT VIDEO ──
      const timerEl = document.getElementById('call-counter');
      const btnReplayCake = document.getElementById('btn-replay-cake');
      let timerInterval = null;
      let seconds = 1;

      function startTimer() {
        seconds = 1;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          seconds++;
          const m = String(Math.floor(seconds / 60)).padStart(2, '0');
          const s = String(seconds % 60).padStart(2, '0');
          if (timerEl) timerEl.textContent = `${m}:${s}`;
        }, 1000);
      }

      btnReplayCake?.addEventListener('click', () => {
        if (timerInterval) clearInterval(timerInterval);
        // Stop video playback when going back
        const frame = document.getElementById('yt-frame');
        if (frame) frame.src = "";
        setScreen('screen-cake');
      });

    });
  </script>
</body>
