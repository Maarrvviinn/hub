<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alles Gute Julia! 🎂</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎀</text></svg>">

  <!-- Google Fonts: Elegant Serif & Modern Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Background Canvas for Confetti -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="mobile-viewport">

    <!-- ═══════════════════════════════════════════════════════════════
         EXPIRED SCREEN (Aktiv ab dem 1.11.)
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-expired" class="screen" aria-label="Abgelaufen" style="display: none;">
      <div class="card card-expired">
        <div class="emoji-header">🔒</div>
        <h2>Nicht mehr verfügbar</h2>
        <p>Diese Website war nur an Julias Geburtstag (31.10.) aktiv.</p>
        <div class="badge-mini">31.10.2006 🎂</div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         SCREEN 1: GEBURTSTAGSEINGABE (Minimal & Ohne Corny Text)
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-lock" class="screen active" aria-label="Geburtsdatum eingeben">
      <div class="card card-lock">
        <div class="icon-tag">🎀</div>

        <form id="lock-form" onsubmit="event.preventDefault();" novalidate>
          <div class="date-picker-row">
            <input 
              id="in-day" 
              class="date-box" 
              type="tel" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              maxlength="2" 
              placeholder="TT" 
              autocomplete="off" 
              autofocus 
              aria-label="Tag"
            >
            <span class="dot">.</span>
            <input 
              id="in-month" 
              class="date-box" 
              type="tel" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              maxlength="2" 
              placeholder="MM" 
              autocomplete="off" 
              aria-label="Monat"
            >
            <span class="dot">.</span>
            <input 
              id="in-year" 
              class="date-box year" 
              type="tel" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              maxlength="4" 
              placeholder="JJJJ" 
              autocomplete="off" 
              aria-label="Jahr"
            >
          </div>

          <button id="btn-confirm-date" class="btn-primary" type="button">
            Bestätigen
          </button>

          <div id="lock-error" class="error-msg" aria-live="polite"></div>
        </form>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         SCREEN 2: KUCHEN ANIMATION & ALLES GUTE ZUM GEBURTSTAG JULIA
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-cake" class="screen" aria-label="Geburtstagskuchen">
      <div class="card card-cake">
        
        <!-- Interactive Cake SVG -->
        <div id="cake-interactive" class="cake-box" role="button" tabindex="0" title="Tippe auf den Kuchen!">
          <svg width="220" height="200" viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Plate -->
            <ellipse cx="110" cy="180" rx="100" ry="14" fill="#FCE7F3" stroke="#F472B6" stroke-width="2"/>
            <ellipse cx="110" cy="177" rx="90" ry="10" fill="#FFFFFF"/>

            <!-- Cake Tier 1 -->
            <path d="M35 130 C35 115 185 115 185 130 V170 C185 180 35 180 35 170 Z" fill="#FBCFE8"/>
            <ellipse cx="110" cy="130" rx="75" ry="15" fill="#FDF2F8"/>
            <path d="M35 130 C45 140 55 140 65 130 C75 140 85 140 95 130 C105 140 115 140 125 130 C135 140 145 140 155 130 C165 140 175 140 185 130 V136 C175 146 165 146 155 136 C145 146 135 146 125 136 C115 146 105 146 95 136 C85 146 75 146 65 136 C55 146 45 146 35 136 Z" fill="#F43F5E"/>

            <!-- Cake Tier 2 -->
            <path d="M55 88 C55 75 165 75 165 88 V122 C165 130 55 130 55 122 Z" fill="#FFF1F2"/>
            <ellipse cx="110" cy="88" rx="55" ry="12" fill="#FFFFFF"/>

            <!-- Berry toppings -->
            <circle cx="70" cy="86" r="6" fill="#E11D48"/>
            <circle cx="90" cy="83" r="6" fill="#E11D48"/>
            <circle cx="110" cy="82" r="6" fill="#E11D48"/>
            <circle cx="130" cy="83" r="6" fill="#E11D48"/>
            <circle cx="150" cy="86" r="6" fill="#E11D48"/>

            <!-- Candle 1 -->
            <rect x="80" y="48" width="6" height="36" rx="3" fill="#FB7185"/>
            <line x1="83" y1="48" x2="83" y2="40" stroke="#475569" stroke-width="2"/>
            <g class="flame flame-1">
              <path d="M83 40 C79 34 80 28 83 22 C86 28 87 34 83 40 Z" fill="#F59E0B"/>
              <circle cx="83" cy="35" r="2" fill="#FEF08A"/>
            </g>
            <path class="smoke" d="M83 40 Q80 30 86 18 T82 6" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>

            <!-- Candle 2 (Center) -->
            <rect x="107" y="42" width="6" height="42" rx="3" fill="#F59E0B"/>
            <line x1="110" y1="42" x2="110" y2="34" stroke="#475569" stroke-width="2"/>
            <g class="flame flame-2">
              <path d="M110 34 C106 28 107 20 110 14 C113 20 114 28 110 34 Z" fill="#F59E0B"/>
              <circle cx="110" cy="28" r="2.5" fill="#FEF08A"/>
            </g>
            <path class="smoke" d="M110 34 Q107 24 113 12 T109 2" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>

            <!-- Candle 3 -->
            <rect x="134" y="48" width="6" height="36" rx="3" fill="#FB7185"/>
            <line x1="137" y1="48" x2="137" y2="40" stroke="#475569" stroke-width="2"/>
            <g class="flame flame-3">
              <path d="M137 40 C133 34 134 28 137 22 C140 28 141 34 137 40 Z" fill="#F59E0B"/>
              <circle cx="137" cy="35" r="2" fill="#FEF08A"/>
            </g>
            <path class="smoke" d="M137 40 Q134 30 140 18 T136 6" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="tap-tip">Tippe auf die Kerzen 🕯️</div>

        <h1 class="congrats-title">
          Alles Gute zum Geburtstag Julia! 🎂
        </h1>

        <button id="btn-next-call" class="btn-primary btn-call-cta" type="button">
          Weiter 📞
        </button>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         SCREEN 3: EINGEHENDER ANRUF (iPhone Style, Klingelt)
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-call" class="screen" aria-label="Eingehender Anruf">
      <div class="iphone-call-screen">
        <div class="call-top">
          <div class="call-type">FaceTime-Videoanruf</div>
          <div class="caller-name">Marvin</div>
          <div class="call-status">Klingelt...</div>
        </div>

        <div class="caller-center">
          <div class="radar-wave"></div>
          <div class="radar-wave delay"></div>
          <div class="avatar-circle">M</div>
        </div>

        <div class="call-actions">
          <div class="action-btn-wrap">
            <button id="btn-decline" class="round-btn btn-decline" type="button" aria-label="Ablehnen">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.8 19.8 0 0 1-3.12-8.69 2 2 0 0 1 2-2.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.29 8.29"/>
                <line x1="22" y1="2" x2="2" y2="22"/>
              </svg>
            </button>
            <span>Ablehnen</span>
          </div>

          <div class="action-btn-wrap">
            <button id="btn-accept" class="round-btn btn-accept" type="button" aria-label="Annehmen">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
            </button>
            <span>Annehmen</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         SCREEN 4: YOUTUBE SHORT VIDEO (Mobil-optimiertes Theater)
         ═══════════════════════════════════════════════════════════════ -->
    <section id="screen-video" class="screen" aria-label="Videoüberraschung">
      <div class="video-card">
        <div class="video-header">
          <span>FaceTime mit Marvin</span>
          <span id="call-counter" class="timer">00:01</span>
        </div>

        <div class="short-frame">
          <iframe 
            id="yt-frame"
            src="https://www.youtube-nocookie.com/embed/XIZSZXd-RYc?autoplay=1&playsinline=1&rel=0&loop=1&playlist=XIZSZXd-RYc" 
            title="Geburtstagsvideo"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>

        <div class="video-footer">
          <a class="btn-yt-direct" href="https://youtube.com/shorts/XIZSZXd-RYc" target="_blank" rel="noopener noreferrer">
            Direkt auf YouTube öffnen ↗
          </a>
          <button id="btn-replay-cake" class="btn-ghost" type="button">
            Zurück zur Torte 🎂
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Mobile Toast Notification -->
  <aside id="toast-note" class="toast" role="status" aria-live="polite"></aside>

  <script src="./script.js"></script>
</body>
</html>
